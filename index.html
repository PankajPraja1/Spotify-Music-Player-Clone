<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
</head>

<body>

    <div class="container flex bg-black">
        <div class="left">
            <div class="close">
                <img width="35" class="invert" src="imgs/close.svg" alt="">
            </div>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo invert"><img width="110" src="imgs/logo1.svg" alt="Spotify Logo"></div>

                <ul>
                    <li><img src="imgs/home.svg" alt="Home Icon">Home</li>
                    <li><img src="imgs/search.svg" alt="Search Icon">Search</li>
                </ul>
            </div>

            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="imgs/playlist.svg" alt="Library Icon">
                    <h3>
                        Your Library
                    </h3>
                </div>
                <div class="songlist">

                    <ul>
                        <!-- <li>
                            <img class="invert" src="imgs/music.svg" alt="Music Icon">
                            <div class="info">
                                <div>${song.replace(".mp3", "")}</div>
                                <div>Pankaj</div>
                            </div>
                            <div class="playnow">
                                <span>Play Now</span>
                                <img class="playb" src="imgs/play.svg" alt="Play Icon">
                            </div>
                        </li> -->
                    </ul>
                </div>

                <div class="footer">
                    <ul>
                        <li>
                            <a href="https://www.spotify.com/in-en/legal/">Legal</a>
                        </li>
                        <li>
                            <a href="https://www.spotify.com/in-en/safetyandprivacy/">Safety &amp; Privacy Center</a>
                        </li>
                        <li>
                            <a href="https://www.spotify.com/in-en/legal/privacy-policy/">Privacy Policy</a>
                        </li>
                        <li>
                            <a href="https://www.spotify.com/in-en/legal/cookies-policy/">Cookies</a>
                        </li>
                        <li>
                            <a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3">About Ads</a>
                        </li>
                        <li>
                            <a href="https://www.spotify.com/in-en/accessibility/">Accessibility</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>

        <div class="right bg-grey rounded">
            <div class="header">
                <div class="nav">
                    <div class="hamburgerContainer">
                        <img width="40" class="hamburger invert" src="imgs/hamburger.svg" alt="">

                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                            color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 18C15 18 9.00001 13.5811 9 12C8.99999 10.4188 15 6 15 6"></path>
                        </svg>

                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                            color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.00005 18C9.00005 18 15 13.5811 15 12C15 10.4188 9 6 9 6"></path>
                        </svg>
                    </div>
                </div>

                <div class="btns">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">Log in</button>
                </div>
            </div>

            <div class="spotifyPlaylists">
                <h1>Spotify Playlists</h1>

                <div class="cardContainer">
                    <!-- <div class="card rounded">
                        <div class="play">
                            <img src="imgs/play.svg" alt="Play Icon">
                        </div>

                        <img class="rounded" src="	https://i.scdn.co/image/ab67616d00001e0225fa2d19b2363a9520a34409"
                            alt="">

                        <h2>Arz kiya hai | Coke Studio Bharat</h2>

                        <p>Anuv Jain</p>
                    </div> -->
                </div>

                <div class="flex justify-center align-center">
                    <div class="playbar">
                        <div class="seekbar">
                            <div class="circle">

                            </div>
                        </div>

                        <div class="abovebar">
                            <div class="songinfo"></div>

                            <div class="songbtns">
                                <img width="35" id="previous" class="invert" src="imgs/preplay.svg" alt="Previous Icon">
                                <img width="35" id="play" class="invert" src="imgs/play.svg" alt="Play Icon">
                                <img width="35" id="next" class="invert" src="imgs/nextplay.svg" alt="Next Icon">
                            </div>

                            <div class="timevol">
                                <div class="songtime"></div>

                                <div class="volume">
                                    <img class="invert" width="35" src="imgs/volume.svg" alt="">
                                    <div class="range">
                                        <input type="range" name="volume" id="">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
